services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: preppilot
      POSTGRES_USER: preppilot
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-dev-only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U preppilot -d preppilot"]
      interval: 5s
      timeout: 3s
      retries: 15
  migrate:
    build: .
    environment: &api-environment
      DATABASE_URL: postgresql+psycopg://preppilot:${POSTGRES_PASSWORD:-local-dev-only}@db:5432/preppilot
      APP_ENV: development
      FRONTEND_ORIGINS: '["http://localhost:8000"]'
      COOKIE_SECURE: "false"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-}
    depends_on:
      db:
        condition: service_healthy
    command: ["sh", "-c", "alembic upgrade head && python -m app.seed"]
  api:
    build: .
    environment: *api-environment
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - uploads:/app/backend/.data/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready')"]
      interval: 15s
      timeout: 5s
      retries: 5
volumes:
  pgdata:
  uploads:
