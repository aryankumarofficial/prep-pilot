[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "preppilot-api"
version = "0.1.0"
description = "Evidence-based placement preparation API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0.36,<2.1", "alembic>=1.14,<2", "psycopg[binary]>=3.2,<4",
  "pydantic-settings>=2.6,<3", "email-validator>=2.2,<3",
  "argon2-cffi>=23.1,<26", "httpx[socks]>=0.28,<1", "python-multipart>=0.0.20,<1",
  "PyMuPDF>=1.25,<2",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
